# ─── Datos del sitio ─────────────────────────────────────────────
title: WallStreetDailyNews.cl
description: Lo más relevante de Wall Street y el Nasdaq, explicado para Sudamérica.
lang: es

# Cambiá USUARIO por tu nombre de usuario de GitHub.
# Si el repositorio no se llama "wallstreetdailynews", cambiá también baseurl.
url: "https://fabiandegiacomid-dotcom.github.io"
baseurl: "/wallstreetdailynews"

# Tu cuenta de Instagram (aparece en la página de enlaces y en el pie).
instagram: "https://www.instagram.com/wallstreetdailynews.cl/"

timezone: America/Argentina/Buenos_Aires

# ─── Noticias (_posts) y papers (_papers) ────────────────────────
permalink: /noticias/:year/:month/:day/:title/
collections:
  papers:
    output: true
    permalink: /papers/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: noticia }
  - scope: { path: "", type: papers }
    values: { layout: paper }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: noticias/feed.xml

exclude:
  - scripts
  - README.md
  - COMO-PUBLICAR.md
  - .pages.yml
